name: terraform-validation

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main, mainline]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.0"

      - name: Check formatting
        run: terraform -chdir=infra/terraform fmt -check -recursive

      - name: Initialize without a backend
        run: terraform -chdir=infra/terraform init -backend=false

      - name: Validate configuration
        run: terraform -chdir=infra/terraform validate
