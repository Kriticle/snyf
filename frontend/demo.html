<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Demo | Snyf</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <meta property="og:image" content="assets/snyf-thumbnail.svg">
    <meta name="twitter:image" content="assets/snyf-thumbnail.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#8B5CF6',
                        secondary: '#F97316',
                        dark: '#111827',
                        "dark-accent": '#1F2937',
                        light: '#F9FAFB',
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                }
            }
        }
    </script>
    <style>
        #pagination-controls button:disabled { cursor: not-allowed; opacity: 0.5; }
    </style>
</head>
<body class="bg-dark text-gray-300">

    <nav class="bg-dark/80 backdrop-blur-lg border-b border-gray-800 sticky top-0 z-50">
        <div class="max-w-screen-xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <a href="index.html" class="flex items-center"><i class="fas fa-braille text-primary text-2xl mr-2"></i><span class="text-xl font-bold text-white">Snyf</span></a>
                <div class="flex items-center">
                    <a href="index.html#waitlist" class="bg-primary text-white rounded-md px-4 py-2 text-sm font-medium hover:bg-primary/90 transition duration-300">Join Waitlist</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-screen-xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <main class="snyf-panel p-6 sm:p-10">
            <div class="mb-8">
                <p class="snyf-kicker mb-3"><i class="fas fa-bolt"></i> Live demo</p>
                <h1 class="text-3xl font-bold text-white">Search by intent, mood, and occasion.</h1>
                <p class="text-gray-400 mt-2">Compare our AI search with traditional keyword search.</p>
                <div class="inline-flex rounded-lg bg-gray-900 p-1 mt-6 space-x-1">
                    <button id="snyf-search-btn" class="px-6 py-2 text-sm font-semibold rounded-md transition-all duration-200"></button>
                    <button id="normal-search-btn" class="px-6 py-2 text-sm font-semibold rounded-md transition-all duration-200"></button>
                </div>
            </div>
            
            <form id="search-form" class="max-w-xl mx-auto mb-10">
                <div class="flex">
                    <input type="text" id="search-input" class="w-full px-5 py-3 text-gray-300 bg-dark-accent border border-r-0 border-gray-600 rounded-l-lg focus:outline-none focus:ring-2 focus:ring-secondary placeholder-gray-500" placeholder="Describe a clothing item..." required>
                    <button type="submit" class="bg-primary text-white font-semibold px-6 py-3 rounded-r-lg hover:bg-primary/90 transition-colors">Search</button>
                </div>
            </form>

            <div class="border-b border-gray-700 pb-4 mb-6">
                <p id="results-count" class="text-sm text-gray-400">Loading items...</p>
            </div>
            
            <div id="results-container" class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-x-6 gap-y-10"></div>
            <div id="pagination-controls" class="flex justify-center items-center mt-12 space-x-4"></div>
        </main>
    </div>

    <footer class="bg-dark text-gray-500 py-8 mt-12"><div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-sm"><p>© 2025 Snyf. All rights reserved.</p></div></footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const snyfBtn = document.getElementById('snyf-search-btn'), normalBtn = document.getElementById('normal-search-btn'),
                  searchForm = document.getElementById('search-form'), searchInput = document.getElementById('search-input'),
                  resultsContainer = document.getElementById('results-container'), paginationControls = document.getElementById('pagination-controls'),
                  resultsCount = document.getElementById('results-count');
            
            const API_BASE_URL = 'https://xydj4rm9eg.execute-api.us-east-1.amazonaws.com', PAGE_SIZE = 12;
            const API_KEY = localStorage.getItem('snyfApiKey');
            const COLLECTION_ID = localStorage.getItem('snyfCollectionId');
            let currentSearchMode = 'snyf', currentPage = 1, totalPages = 1, totalItems = 0, lastQuery = '';

            const updateToggleUI = () => {
                snyfBtn.textContent = 'Snyf AI Search';
                normalBtn.textContent = 'Normal Search';
                if (currentSearchMode === 'snyf') {
                    snyfBtn.className = 'px-6 py-2 text-sm font-semibold rounded-md transition-all duration-200 bg-gradient-to-r from-primary to-secondary text-white shadow-lg';
                    normalBtn.className = 'px-6 py-2 text-sm font-semibold rounded-md transition-all duration-200 bg-transparent text-gray-400';
                    searchInput.placeholder = "Describe a clothing item...";
                } else {
                    snyfBtn.className = 'px-6 py-2 text-sm font-semibold rounded-md transition-all duration-200 bg-transparent text-gray-400';
                    normalBtn.className = 'px-6 py-2 text-sm font-semibold rounded-md transition-all duration-200 bg-dark-accent text-secondary shadow-lg';
                    searchInput.placeholder = "Enter keywords like 'black top'... ";
                }
            };

            const displayResults = (results) => {
                resultsContainer.innerHTML = '';
                if (!results || results.length === 0) { resultsContainer.innerHTML = `<p class="col-span-full text-center text-gray-400">No results found.</p>`; return; }
                results.forEach(item => {
                    const card = `
                        <a href="#" class="group">
                            <div class="w-full snyf-product-card">
                                <img src="${(item.image_urls && item.image_urls[0]) || item.image_url || 'https://via.placeholder.com/300x400?text=No+Image'}" alt="${item.name || item.title || item.product_id || 'Product'}"
                                 class="w-full h-72 object-cover object-center group-hover:opacity-75 transition-opacity">
                            </div>
                            <h3 class="mt-4 text-sm text-gray-400">${item.brand || item.category || 'Snyf result'}</h3>
                            <p class="mt-1 text-md font-medium text-gray-200 group-hover:text-secondary transition-colors">${item.name || item.title || item.product_id || 'Untitled product'}</p>
                        </a>`;
                    resultsContainer.insertAdjacentHTML('beforeend', card);
                });
            };

            const renderPagination = () => {
                resultsCount.textContent = `Showing ${Math.min((currentPage - 1) * PAGE_SIZE + 1, totalItems)} - ${Math.min(currentPage * PAGE_SIZE, totalItems)} of ${totalItems} results`;
                paginationControls.innerHTML = ''; if (totalPages <= 1) return; const prevDisabled = currentPage === 1 ? 'disabled' : ''; const nextDisabled = currentPage === totalPages ? 'disabled' : ''; paginationControls.innerHTML = `<button id="prev-btn" class="px-4 py-2 text-sm font-semibold rounded-md bg-dark-accent text-gray-300 border border-gray-700" ${prevDisabled}>Previous</button><span class="text-sm text-gray-400">Page ${currentPage} of ${totalPages}</span><button id="next-btn" class="px-4 py-2 text-sm font-semibold rounded-md bg-dark-accent text-gray-300 border border-gray-700" ${nextDisabled}>Next</button>`; document.getElementById('prev-btn')?.addEventListener('click', () => { currentPage--; lastQuery ? performSearch(lastQuery, currentPage) : fetchInitialCatalog(currentPage); }); document.getElementById('next-btn')?.addEventListener('click', () => { currentPage++; lastQuery ? performSearch(lastQuery, currentPage) : fetchInitialCatalog(currentPage); }); 
            };
            
            const handleApiResponse = (data) => {
                totalItems = data.total_items || data.results?.length || 0;
                totalPages = data.total_pages || 1;
                currentPage = data.current_page || 1;
                displayResults(data.results);
                renderPagination();
            };

            const performSearch = async (query, page = 1) => {
                lastQuery = query;
                resultsContainer.innerHTML = `<p class="col-span-full text-center text-gray-400">Searching...</p>`;
                paginationControls.innerHTML = '';
                try {
                    if (currentSearchMode !== 'snyf') {
                        if (!API_KEY || !COLLECTION_ID) throw new Error('Sign up and save an API key plus collection in the dashboard first.');
                        const response = await fetch(`${API_BASE_URL}/search/keyword`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'x-api-key': API_KEY },
                            body: JSON.stringify({ collection_id: COLLECTION_ID, query, top_k: PAGE_SIZE })
                        });
                        if (!response.ok) {
                            const error = await response.json().catch(() => ({}));
                            throw new Error(error.detail || 'Keyword API Error');
                        }
                        handleApiResponse(await response.json());
                        return;
                    }
                    if (!API_KEY || !COLLECTION_ID) throw new Error('Sign up and save an API key plus collection in the dashboard first.');
                    const response = await fetch(`${API_BASE_URL}/search`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'x-api-key': API_KEY },
                        body: JSON.stringify({ collection_id: COLLECTION_ID, query, top_k: PAGE_SIZE })
                    });
                    if (!response.ok) {
                        const error = await response.json().catch(() => ({}));
                        throw new Error(error.detail || 'API Error');
                    }
                    handleApiResponse(await response.json());
                } catch (error) { resultsContainer.innerHTML = `<p class="col-span-full text-center text-red-500">Failed to fetch results.</p>`; }
            };

            const fetchInitialCatalog = async (page = 1) => {
                lastQuery = '';
                resultsContainer.innerHTML = `<p class="col-span-full text-center text-gray-400">Search your uploaded catalog to view products.</p>`;
                paginationControls.innerHTML = '';
            };

            snyfBtn.addEventListener('click', () => { currentSearchMode = 'snyf'; updateToggleUI(); });
            normalBtn.addEventListener('click', () => { currentSearchMode = 'normal'; updateToggleUI(); });
            searchForm.addEventListener('submit', (e) => { e.preventDefault(); const query = searchInput.value.trim(); if(query) performSearch(query, 1); });

            updateToggleUI(); 

            const urlParams = new URLSearchParams(window.location.search); const queryFromURL = urlParams.get('query');
            if (queryFromURL) { searchInput.value = queryFromURL; performSearch(queryFromURL, 1); } else { fetchInitialCatalog(); }
        });
    </script>
</body>
</html>
